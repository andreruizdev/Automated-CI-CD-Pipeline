name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint repository
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

  build_scan:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker run --detach --rm --name pipeline-demo -p 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker rm --force pipeline-demo >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ --output /tmp/pipeline-demo.html
          grep --fixed-strings --quiet 'CI/CD, made visible.' /tmp/pipeline-demo.html
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: docker push "$IMAGE"

  deploy:
    needs: build_scan
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Validate deployment settings
        env:
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          [[ -n "$K8S_DEPLOYMENT" ]] || { echo "K8S_DEPLOYMENT is required"; exit 1; }
          [[ -n "$K8S_CONTAINER" ]] || { echo "K8S_CONTAINER is required"; exit 1; }
          [[ -n "$K8S_NAMESPACE" ]] || { echo "K8S_NAMESPACE is required"; exit 1; }
      - name: Deploy image
        env:
          IMAGE: ${{ needs.build_scan.outputs.image }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE" --namespace "$K8S_NAMESPACE"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" --namespace "$K8S_NAMESPACE" --timeout=180s