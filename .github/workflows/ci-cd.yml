---
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint repository
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true

  build_scan:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker run --detach --rm --name pipeline-demo -p 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker rm --force pipeline-demo >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ --output /tmp/pipeline-demo.html
          grep --fixed-strings --quiet \
            'CI/CD, made visible.' /tmp/pipeline-demo.html
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Create local Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: automated-ci-cd
          config: k8s/kind/cluster.yaml
      - name: Deploy to local Kubernetes cluster
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker tag "$IMAGE" pipeline-demo:local
          kind load docker-image pipeline-demo:local --name automated-ci-cd
          kubectl apply -k k8s/overlays/local
          kubectl rollout status deployment/pipeline-demo \
            --namespace pipeline-demo-local \
            --timeout=120s
          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8081/ | grep --fixed-strings --quiet \
              'CI/CD, made visible.'
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: docker push "$IMAGE"

  deploy:
    needs: build_scan
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Apply production resources
        run: kubectl apply -k k8s/overlays/production
      - name: Deploy image
        env:
          IMAGE: ${{ needs.build_scan.outputs.image }}
        run: |
          kubectl set image deployment/pipeline-demo \
            pipeline-demo="$IMAGE" \
            --namespace pipeline-demo
          kubectl rollout status deployment/pipeline-demo \
            --namespace pipeline-demo \
            --timeout=180s
