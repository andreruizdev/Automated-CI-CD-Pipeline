---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pipeline-demo-ingress
  namespace: pipeline-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pipeline-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pipeline-demo
      ports:
        - protocol: TCP
          port: 8080
