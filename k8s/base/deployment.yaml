apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo
  namespace: pipeline-demo
  labels:
    app.kubernetes.io/name: pipeline-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pipeline-demo
          image: pipeline-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
