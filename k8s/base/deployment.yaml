---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo
  namespace: pipeline-demo
  labels:
    app.kubernetes.io/name: pipeline-demo
  annotations:
    checkov.io/skip1: >-
      CKV_K8S_43=Production injects the exact registry digest after the Trivy gate; this is a local base placeholder.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pipeline-demo
          image: pipeline-demo:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
