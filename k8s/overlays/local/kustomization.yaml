apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pipeline-demo-local
resources:
  - ../../base
images:
  - name: pipeline-demo
    newName: pipeline-demo
    newTag: local
patches:
  - target:
      kind: Service
      name: pipeline-demo
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
